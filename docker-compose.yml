# Déploiement de l'outil d'aide au choix variétal YamHub.
#
#   docker compose up -d --build      démarrer (ou redémarrer après un git pull)
#   docker compose logs -f            suivre les journaux
#   docker compose down               arrêter
#
# Les identifiants ne sont pas ici : ils vivent dans un fichier .env à côté de
# ce compose, non versionné. Modèle : .env.example
services:
  decision-tool:
    build: .
    container_name: yamhub-decision-tool
    ports:
      - "8501:8501"
    env_file:
      - .env
    # LE point de ce déploiement : le conteneur repart tout seul après un
    # plantage ET après un redémarrage de la machine. C'est ce qui remplace la
    # mise en veille subie sur Streamlit Community Cloud.
    restart: unless-stopped
    volumes:
      # Les données en lecture seule, montées plutôt que copiées : mettre à
      # jour un CSV ne demande alors qu'un « docker compose restart », pas une
      # reconstruction de l'image.
      - ./data:/app/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"      # sans cela les journaux grossissent sans fin
        max-file: "3"

  # Outil de recadrage des photos drone. Même image que ci-dessus, autre
  # commande : il n'y a qu'un seul jeu de dépendances à construire.
  crop-tool:
    build: .
    container_name: yamhub-crop-tool
    command:
      - streamlit
      - run
      - crop_tool.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8502:8501"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Photos drone brutes, en lecture seule : l'outil ne fait que les lire.
      # DRONE_DIR se règle dans .env — le chemin varie d'une campagne à l'autre.
      - ${DRONE_DIR:-./data/sources/drone}:/photos-drone:ro
      # Sortie EN ÉCRITURE. Sans ce volume, deux choses cassent : le montage
      # :ro du service voisin ferait échouer l'enregistrement, et ce qui serait
      # écrit dans la couche du conteneur disparaîtrait au redémarrage — donc
      # aussi le suivi « déjà faites ».
      - crop-out:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crop-out:
